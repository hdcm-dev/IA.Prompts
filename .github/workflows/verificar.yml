# Control mínimo del repositorio: los enlaces relativos de los .md que caen dentro del árbol apuntan a archivos
# existentes. Es la corrida que lee la guarda de merge (G3) de la conformación automática (ENTREGA.md).
name: Verificar

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  enlaces:
    name: enlaces
    # Guarda contra forks: el runner es propio; sólo corre para ramas de este mismo repositorio.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, i7infra-dev]
    timeout-minutes: 10
    steps:
      - name: Traer el árbol
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Enlaces relativos
        run: python3 -I tools/verificar_enlaces.py
